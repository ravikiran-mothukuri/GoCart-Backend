
##
# Database Configuration - Railway MySQL
# First, let's try without SSL to debug the connection
spring.datasource.url=${DB_URL}?allowPublicKeyRetrieval=true&serverTimezone=UTC&useSSL=false

spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Configuration
server.port=${PORT:8080}
jwt.secret=${JWT_SECRET}

# Debug Logging - This will show the actual DB URL being used
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
logging.level.com.zaxxer.hikari=TRACE
logging.level.org.hibernate.engine.jdbc.env.internal=DEBUG
